[project]
name = "monte-carlo-webull-sec-openai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pandas>=3.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "arch>=6.3",
    "httpx>=0.27",
    "pyarrow>=16.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pandas-stubs>=2.2", "scipy-stubs>=1.13", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
exclude = ["notebooks", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
