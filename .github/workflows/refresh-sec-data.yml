name: Refresh SEC NAV Data

# Refreshes the currently committed MC fund universe. The application itself
# remains offline and reads only data/processed; this workflow is the explicit
# network boundary for keeping the NAV panel current.
on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 01:00 ICT next day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Download latest SEC NAV data
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          SEC_API_BASE_URL: ${{ secrets.SEC_API_BASE_URL || 'https://api.sec.or.th' }}
        run: python scripts/sec_download_mvp.py

      - name: Run test suite against refreshed data
        run: pytest

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          if git diff --cached --quiet; then
            echo "No NAV changes to commit."
          else
            git commit -m "chore(data): scheduled SEC NAV refresh $(date -u +%Y-%m-%d)"
            git push
          fi
